[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-auto-quantlab"
version = "0.2.2"
description = "Offline TMF strategy research and paper execution with explicit safety boundaries"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["tzdata==2026.5; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["quantlab*"]
exclude = ["archives*", "trader*", "tests*"]

# Keep the eight G3 source/hash inputs explicit and independently testable.
[tool.ruff]
target-version = "py311"
line-length = 160
fix = false
# Concise diagnostics avoid Ruff 0.16.10 full-diff rendering panics on CRLF input.
output-format = "concise"
force-exclude = true
exclude = [
    "quantlab/research.py",
    "quantlab/provider.py",
    "quantlab/core.py",
    "quantlab/strategies.py",
    "quantlab/backtest.py",
    "quantlab/data.py",
    "desktop_chatgpt_auth.py",
    "desktop_chatgpt_provider.py",
]
extend-exclude = [
    # Frozen producer literals would be reformatted; preserve the whole file.
    "quantlab/saved_candidate_pool.py",
    "archives",
    ".claude", "AGENTS.md", "CLAUDE.md", ".tmp*", ".t*-work",
    "build", "dist", ".venv", ".runtime-sqlite", ".git", ".gitnexus",
    "__pycache__", ".pytest_cache", ".ruff_cache", "*.egg-info",
    "tests/fixtures",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E402", "E711", "E712", "E713", "E714", "E721", "E722", "E9", "F"]

