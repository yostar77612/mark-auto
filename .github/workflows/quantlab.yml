name: Quantlab offline gates
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quantlab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: ${{ matrix.group == 'research' && 'offline research' || 'offline' }} (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11', group: all}
          - {os: ubuntu-latest, python: '3.12', group: all}
          - {os: windows-latest, python: '3.11', group: core}
          - {os: windows-latest, python: '3.12', group: core}
          - {os: windows-latest, python: '3.11', group: research}
          - {os: windows-latest, python: '3.12', group: research}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Provision pinned private SQLite without changing the Python profile
        run: python tools/install_sqlite_runtime.py --destination build/sqlite-runtime --report dist/validation/sqlite-runtime.json --github
      - run: python -m pip install tzdata==2026.5
      - name: Install Linux Qt system runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libxkbcommon0
      # The complete suite includes native desktop integration. Install its
      # pinned Qt runtime rather than skipping tests when Qt is absent.
      - run: 'python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --force-reinstall --no-cache-dir --report qt-install-report.json -r requirements-qt-ci.lock'
      - name: Install pinned offline auth smoke runtime
        run: python tools/install_desktop_auth.py --report dist/validation/desktop-auth-install.json
      - name: Verify complete desktop smoke runtime before tests
        run: python -c "from desktop import _auth_smoke_dependencies; print(_auth_smoke_dependencies())"
      - name: Preserve hash-locked authentication runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-auth-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.group }}
          path: |
            dist/validation/desktop-auth-install.json
            qt-install-report.json
            dist/validation/sqlite-runtime.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run exact-coverage offline test group
        run: python tools/run_test_group.py --group ${{ matrix.group }} --manifest dist/validation/test-inventory.json
      - name: Preserve exact-head discovery and selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-inventory-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.group }}
          path: |
            dist/validation/test-inventory.json
            dist/validation/smoke-timeout-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Observe native Paper timing after failure (not acceptance)
        if: failure() && runner.os == 'Windows' && matrix.group == 'core'
        run: python tools/diagnose_paper_replay.py dist/validation/paper-replay-timing.json
      - name: Preserve failed native timing evidence
        if: failure() && runner.os == 'Windows' && matrix.group == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-timing-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.group }}
          path: dist/validation/paper-replay-timing*.json
          if-no-files-found: warn
          retention-days: 7
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Provision pinned private SQLite without changing the Python profile
        run: python tools/install_sqlite_runtime.py --destination build/sqlite-runtime --report dist/validation/sqlite-runtime.json --github
      - run: python -m pip install -r requirements-ui.lock
      - name: Install Linux Qt system runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libxkbcommon0
      - run: 'python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --force-reinstall --no-cache-dir --report qt-install-report.json -r requirements-qt-ci.lock'
      - name: Install pinned offline auth smoke runtime
        run: python tools/install_desktop_auth.py --report dist/validation/desktop-auth-install.json
      - name: Verify complete desktop smoke runtime before tests
        run: python -c "from desktop import _auth_smoke_dependencies; print(_auth_smoke_dependencies())"
      - name: Preserve hash-locked authentication runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-auth-ui-linux312
          path: |
            dist/validation/desktop-auth-install.json
            qt-install-report.json
            dist/validation/sqlite-runtime.json
          if-no-files-found: warn
          retention-days: 7
      - run: python -m unittest discover -s tests -v
  quality:
    name: Static quality and credential gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/quality_gate.py --history
      - run: python -m unittest discover -s tests -p test_quality_gate.py -v
      - name: Observe potential Windows x64 guest host resources (not acceptance)
        run: python tools/probe_windows_guest_host.py --output dist/validation/windows-guest-host.json
      - name: Test read-only host capability report
        run: python -m unittest discover -s tests -p test_windows_guest_host.py -v
      - name: Preserve host availability evidence without starting a guest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-guest-host-availability
          path: dist/validation/windows-guest-host.json
          if-no-files-found: warn
          retention-days: 7
  security:
    name: Dependency audit (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ui
            os: ubuntu-latest
            requirements: requirements-ui.lock
            python: '3.12'
          - profile: qt-linux311
            os: ubuntu-latest
            requirements: requirements-qt-ci.lock
            python: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      # Keep the selected runtime closure separate from audit tooling. Legacy
      # requirements.txt is deliberately outside this audit and is NOT certified.
      - name: Resolve complete UI runtime dependency closure
        if: matrix.profile == 'ui'
        run: python -m pip install --ignore-installed --target audit-runtime -r ${{ matrix.requirements }}
      - name: Resolve hash-locked Linux CP311 Qt compatibility closure
        if: matrix.profile == 'qt-linux311'
        run: 'python -m pip --isolated install --index-url https://pypi.org/simple --ignore-installed --target audit-runtime --require-hashes --only-binary=:all: --no-cache-dir -r requirements-qt-ci.lock'
      - name: Install verified PyPA audit release
        run: python -m pip install pip-audit==2.10.1
      - name: Fail on known runtime vulnerabilities or audit errors
        run: python -m pip_audit --path audit-runtime --cache-dir "${{ runner.temp }}/pip-audit-cache" --progress-spinner off --strict
