name: Quantlab offline gates
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quantlab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tzdata==2026.5
      # The complete suite includes native desktop integration. Install its
      # pinned Qt runtime rather than skipping tests when Qt is absent.
      - run: python -m pip install --only-binary=:all: PySide6-Essentials==6.12.0 shiboken6==6.12.0
      - run: python -m unittest discover -s tests -v
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.lock
      - run: python -m pip install --only-binary=:all: PySide6-Essentials==6.12.0 shiboken6==6.12.0
      - run: python -m unittest discover -s tests -v
  quality:
    name: Static quality and credential gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/quality_gate.py --history
      - run: python -m unittest discover -s tests -p test_quality_gate.py -v
  security:
    name: Dependency audit (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ui
            os: ubuntu-latest
            requirements: requirements-ui.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      # Keep the selected runtime closure separate from audit tooling. Legacy
      # requirements.txt is deliberately outside this audit and is NOT certified.
      - name: Resolve complete runtime dependency closure
        run: python -m pip install --ignore-installed --target audit-runtime -r ${{ matrix.requirements }}
      - name: Install verified PyPA audit release
        run: python -m pip install pip-audit==2.10.1
      - name: Fail on known runtime vulnerabilities or audit errors
        run: python -m pip_audit --path audit-runtime --cache-dir "${{ runner.temp }}/pip-audit-cache" --progress-spinner off --strict
