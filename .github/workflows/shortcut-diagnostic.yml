name: Temporary exact-candidate shortcut diagnostic
on:
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: shortcut-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  observe:
    if: github.repository == 'yostar77612/mark-auto' && github.event.pull_request.number == 96
    name: Observe actual prior-candidate shortcut properties (diagnostic only)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse reviewed packaging scripts before diagnostic
        shell: pwsh
        run: ./packaging/validate_powershell.ps1
      - name: Compile current ownership helper only on the ephemeral builder
        shell: powershell
        run: ./packaging/build_acceptance_helper.ps1
      - name: Fetch only the hash-pinned failed-run candidates without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Ephemeral GitHub host required' }
          $folder = Join-Path (Get-Location) 'build/shortcut-diagnostic'
          if (Test-Path -LiteralPath $folder) { throw 'Fresh private diagnostic directory required' }
          [void][IO.Directory]::CreateDirectory($folder)
          $archive = Join-Path $folder 'prior.zip'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/yostar77612/mark-auto/actions/artifacts/12609445307/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 81063573 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4e6e72c159683c1843ad85e0d7b11b34dae482a6107720e53f322dce8bd4b78a') { throw 'Prior diagnostic archive identity changed' }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $seen = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
            $total = 0L
            if ($zip.Entries.Count -ge 3000) { throw 'Archive entry bound exceeded' }
            foreach ($entry in $zip.Entries) {
              $parts = $entry.FullName.Split('/')
              if ([IO.Path]::IsPathRooted($entry.FullName) -or $entry.FullName.Contains('\') -or $entry.FullName.Contains(':') -or $parts -contains '..' -or -not $seen.Add($entry.FullName)) { throw 'Unsafe archive member' }
              $total += $entry.Length
              if ($total -ge 600000000) { throw 'Archive expansion bound exceeded' }
            }
          } finally { $zip.Dispose() }
          $extracted = Join-Path $folder 'extracted'
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $extracted)
          $manifest = Get-Content -LiteralPath (Join-Path $extracted 'build-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_commit -cne 'a5b919843fce2c259c819870ea717721aa9553df') { throw 'Not the exact previously observed PR merge checkout' }
          $expected = @{'MarkAuto-0.0.0-windows-x64-setup.exe'='2b0355c56b0337e7dfc912ce144ba698080aa43a6e9e0f0c6d46e26c51bccb8b'; 'MarkAuto-0.2.2-windows-x64-setup.exe'='be726d809faa98e6530ebd30b5c45c87779995dd1a6bc5551d6f72918672e00c'}
          [void][IO.Directory]::CreateDirectory((Join-Path (Get-Location) 'dist/installers'))
          foreach ($name in $expected.Keys) {
            $path = Join-Path $extracted ('installers/' + $name)
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$name] -or $manifest.artifacts_sha256.$name -cne $expected[$name]) { throw 'Prior candidate installer identity changed' }
            Copy-Item -LiteralPath $path -Destination (Join-Path 'dist/installers' $name)
          }
      - name: Observe unchanged complete lifecycle with raw shortcut evidence
        shell: pwsh
        # This is an observation of fixed older binaries using current assertions.
        # It is never exact-current-head installer or clean-client acceptance.
        run: ./packaging/test_installer.ps1 -Version 0.2.2 -CreateRecoveryHandoff -AcceptanceScope HostedCi -BaselineManifest build/shortcut-diagnostic/extracted/build-manifest.json -CandidateManifest build/shortcut-diagnostic/extracted/build-manifest.json
      - name: Preserve actual values and failures without relabelling them as acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shortcut-actual-properties-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/validation/
          if-no-files-found: warn
          retention-days: 1
